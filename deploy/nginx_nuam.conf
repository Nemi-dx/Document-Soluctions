# /etc/nginx/sites-available/nuam   (enlazar en sites-enabled y quitar el sitio "default")
# nginx recibe a los usuarios en el puerto 80 y se los pasa a gunicorn (127.0.0.1:8000).
server {
    listen 80 default_server;
    server_name _;

    # Los certificados PDF pueden pesar hasta 10 MB; el valor por defecto de nginx (1 MB) los rechazaría.
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;                       # la bitácora usa esta cabecera
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;                    # Django sabe si la conexión fue HTTPS
        proxy_read_timeout 60s;
    }
}
